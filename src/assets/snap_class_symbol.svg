<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="sc-sym-grad-primary" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="100%" stop-color="#7C83FD" />
    </linearGradient>
    <linearGradient id="sc-sym-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C83FD" />
      <stop offset="100%" stop-color="#9BA5FF" />
    </linearGradient>
    <linearGradient id="sc-sym-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9BA5FF" stop-opacity="0.2" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="sc-sym-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="60" cy="60" r="46" fill="#5865F2" fill-opacity="0.18" filter="url(#sc-sym-glow)" />

  <!-- Outer Isometric Smart-Classroom Prism / Diamond Aperture -->
  <g transform="translate(60, 60)">
    <!-- Top-Right Facet (Knowledge / Classroom Portal) -->
    <path d="M 0,-48 L 42,-24 L 42,22 L 0,-2 Z" fill="url(#sc-sym-grad-primary)" fill-opacity="0.95" />
    
    <!-- Top-Left Facet (AI Neural Ray) -->
    <path d="M 0,-48 L -42,-24 L -42,22 L 0,-2 Z" fill="url(#sc-sym-grad-accent)" fill-opacity="0.85" />
    
    <!-- Bottom Anchor Facet (Fast 'Snap' Convergence) -->
    <path d="M -42,22 L 0,46 L 42,22 L 0,16 Z" fill="url(#sc-sym-grad-primary)" fill-opacity="0.75" />

    <!-- Center Floating Neural Prism / Camera Shutter Spark -->
    <polygon points="0,-22 20,-8 20,14 0,26 -20,14 -20,-8" fill="#080B18" stroke="url(#sc-sym-grad-accent)" stroke-width="3" />

    <!-- Core AI Lightning Node (The Instant 'Snap' Pulse) -->
    <polygon points="0,-12 4,-2 14,0 4,2 0,12 -4,2 -14,0 -4,-2" fill="#FFFFFF" />
    
    <!-- Accent Dots / Connection Pins -->
    <circle cx="0" cy="-48" r="3.5" fill="#FFFFFF" />
    <circle cx="42" cy="-24" r="3" fill="#9BA5FF" />
    <circle cx="-42" cy="-24" r="3" fill="#7C83FD" />
    <circle cx="0" cy="46" r="3.5" fill="#5865F2" />
  </g>
</svg>
